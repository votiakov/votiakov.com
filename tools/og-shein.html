<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card, SHEIN data</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0d0c; color: #ecebe6; }
  .glow { position: absolute; right: -180px; top: -220px; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(255,79,31,.30), transparent); }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 88px 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .k { font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: .06em; color: #ff6a3d; text-transform: uppercase; }
  h1 { font: 600 66px/1.03 "Inter", sans-serif; letter-spacing: -0.04em; margin: 0; max-width: 1000px; }
  h1 em { white-space: nowrap; font: italic 400 74px/1 "Instrument Serif", serif; color: #ff6a3d; letter-spacing: -0.01em; }
  .stats { display: flex; gap: 48px; }
  .stats div { display: grid; gap: 6px; }
  .stats b { font: 600 46px/1 "Inter", sans-serif; letter-spacing: -0.04em; }
  .stats span { font: 400 20px/1.3 "Inter", sans-serif; color: #b6b4ac; }
  .who { display: flex; align-items: center; gap: 18px; font: 400 22px/1.35 "Inter", sans-serif; color: #b6b4ac; }
  .who b { color: #ecebe6; font-weight: 600; }
  .who img { width: 60px; height: 60px; border-radius: 50%; background: #ff4f1f; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="k">votiakov.com/shein-data</div>
  <h1>SHEIN product data: every product, <em>every country, every day.</em></h1>
  <div class="stats">
    <div><b>5.15M</b><span>UK products</span></div>
    <div><b>~14,500</b><span>new products a day</span></div>
    <div><b>9</b><span>European storefronts</span></div>
  </div>
  <div class="who"><img src="/assets/portrait.webp" alt=""><div><b>Andrii Votiakov</b> · datasets, daily feeds, price history</div></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfbf9; color: #17171c; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 84px 96px; display: grid; grid-template-columns: 1fr auto; column-gap: 64px; align-items: center; font-family: "Inter", sans-serif; }
  h1 { font-size: 76px; line-height: 1.05; margin: 0 0 22px; letter-spacing: -0.03em; font-weight: 650; }
  .r { font-size: 36px; color: #4a4a52; margin: 0 0 40px; line-height: 1.3; }
  .f { font-size: 26px; color: #5b5b64; line-height: 1.55; margin: 0; }
  .u { position: absolute; left: 96px; bottom: 64px; font-size: 26px; color: #2a55a8; font-weight: 600; }
  img { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #e5e5e0; }
  .bar { position: absolute; left: 0; top: 0; width: 1200px; height: 10px; background: #17171c; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="card">
  <div>
    <h1>Andrii Votiakov</h1>
    <p class="r">Software engineer, lead engineer, former CTO</p>
    <p class="f">10+ years with production systems<br>Backend · cloud infrastructure · web data · AI</p>
  </div>
  <img src="/assets/photo.jpg" alt="">
</div>
<div class="u">votiakov.com</div>
</body>
</html>

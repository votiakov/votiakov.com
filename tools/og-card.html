<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0d0c; color: #ecebe6; }
  .glow { position: absolute; right: -180px; top: -220px; width: 760px; height: 760px; background: radial-gradient(closest-side, rgba(255,79,31,.30), transparent); }
  .card { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 76px 88px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .k { font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: .06em; color: #ff6a3d; text-transform: uppercase; }
  h1 { font: 600 70px/1.03 "Inter", sans-serif; letter-spacing: -0.04em; margin: 0; max-width: 980px; }
  h1 em { white-space: nowrap; font: italic 400 78px/1 "Instrument Serif", serif; color: #ff6a3d; letter-spacing: -0.01em; }
  .who { display: flex; align-items: center; gap: 22px; font: 400 26px/1.35 "Inter", sans-serif; color: #b6b4ac; }
  .who b { color: #ecebe6; font-weight: 600; }
  .who img { width: 84px; height: 84px; border-radius: 50%; background: #ff4f1f; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="k">votiakov.com</div>
  <h1>I scrape the web at scale, build software products and <em>cut cloud bills.</em></h1>
  <div class="who"><img src="/assets/portrait.webp" alt=""><div><b>Andrii Votiakov</b><br>Lead engineer and former CTO · Łódź, Poland</div></div>
</div>
</body>
</html>
